name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *" # daily, so the snake tracks new contributions
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # greyscale dots + white snake to match the dark notepad theme of danielchen.me
          outputs: |
            dist/snake-dark.svg?color_snake=#f5f5f5&color_dots=#1f1f1f,#3a3a3a,#5c5c5c,#8a8a8a,#d4d4d4
            dist/snake-light.svg?palette=github-light&color_snake=#262626

      # SVGs live on the `output` branch so they don't spam commits on master
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
